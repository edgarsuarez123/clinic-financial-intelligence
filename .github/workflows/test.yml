name: Platform verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate disposable CI credentials
        run: |
          python - <<'PY'
          import os, secrets
          values = {
              "POSTGRES_PASSWORD": secrets.token_urlsafe(32),
              "APP_DB_PASSWORD": secrets.token_urlsafe(32),
              "MIGRATION_DB_PASSWORD": secrets.token_urlsafe(32),
              "QUERY_DB_PASSWORD": secrets.token_urlsafe(32),
          }
          for key, value in values.items():
              print(f"::add-mask::{value}")
          with open(os.environ['GITHUB_ENV'],'a') as env:
              for key, value in values.items():
                  env.write(f"{key}={value}\n")
              env.write("TEST_DATABASE_URL=postgresql://clinic_app:{APP_DB_PASSWORD}@localhost:5432/clinic\n".format(**values))
              env.write("TEST_MIGRATION_DATABASE_URL=postgresql://clinic_migrator:{MIGRATION_DB_PASSWORD}@localhost:5432/clinic\n".format(**values))
              env.write("TEST_QUERY_DATABASE_URL=postgresql://clinic_query:{QUERY_DB_PASSWORD}@localhost:5432/clinic\n".format(**values))
          PY
      - run: pip install -r requirements-test.lock
      - run: npm ci
        working-directory: frontend
      - run: npm test -- --run
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: docker compose -f compose.yaml -f compose.test.yaml up -d --wait db
      - run: python -m pytest -q
      - run: docker compose -f compose.yaml -f compose.test.yaml up -d --build api worker web
      - name: API container smoke test
        run: python -m scripts.smoke_check --url http://127.0.0.1:8010/api/v1/health --expected-status 401
      - name: React web container smoke test
        run: python -m scripts.smoke_check --url http://127.0.0.1:3000/ --expected-status 200
      - name: Container diagnostics on failure
        if: failure()
        run: docker compose -f compose.yaml -f compose.test.yaml logs --no-color --tail 80 api worker web migrate
      - if: always()
        run: docker compose -f compose.yaml -f compose.test.yaml down -v
