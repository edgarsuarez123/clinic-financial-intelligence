[build-system]
requires = ["setuptools>=75,<83"]
build-backend = "setuptools.build_meta"

[project]
name = "clinic-financial-intelligence"
version = "0.6.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1",
  "psycopg[binary]>=3.2,<4", "argon2-cffi>=23.1,<26",
  "pdfplumber>=0.11,<0.12", "defusedxml>=0.7,<1",
  "streamlit>=1.63,<2", "altair>=5,<7", "requests>=2.32,<3"
]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "openpyxl>=3.1,<4", "reportlab>=4,<6"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a disposable PostgreSQL database"]
