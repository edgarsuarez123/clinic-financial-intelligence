services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: clinic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:?Set MIGRATION_DB_PASSWORD}
      QUERY_DB_PASSWORD: ${QUERY_DB_PASSWORD:?Set QUERY_DB_PASSWORD}
    volumes:
      - database:/var/lib/postgresql/data
      - ./infra/init-db.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinic"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    build: .
    command: ["python", "-m", "app.migrate"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      MIGRATION_DATABASE_URL: postgresql://clinic_migrator:${MIGRATION_DB_PASSWORD:?required}@db:5432/clinic
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql://clinic_app:${APP_DB_PASSWORD:?required}@db:5432/clinic
      SESSION_MINUTES: ${SESSION_MINUTES:-30}
      LOGIN_LIMIT: ${LOGIN_LIMIT:-5}
      LOGIN_WINDOW_SECONDS: ${LOGIN_WINDOW_SECONDS:-900}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      INGESTION_CONFIG_PATH: /srv/clinic/config/ingestion.json
      QUERY_CONFIG_PATH: /srv/clinic/config/query.json
      QUERY_DATABASE_URL: postgresql://clinic_query:${QUERY_DB_PASSWORD:?required}@db:5432/clinic
      LLM_API_KEY: ${LLM_API_KEY:-}
      SIMULATION_CONFIG_PATH: /srv/clinic/config/simulation.json
      ANALYTICS_CONFIG_PATH: /srv/clinic/config/analytics.json
    volumes:
      - ${CONFIG_DIRECTORY:-./config}:/srv/clinic/config:ro
    ports: ["127.0.0.1:${API_PORT:-8010}:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
  worker:
    build: .
    command: ["python", "-m", "app.ingestion.worker"]
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: postgresql://clinic_app:${APP_DB_PASSWORD:?required}@db:5432/clinic
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
  web:
    build: ./frontend
    ports: ["127.0.0.1:${WEB_PORT:-3000}:8080"]
    depends_on: [api]
    restart: unless-stopped
  ollama:
    profiles: [ollama]
    image: ollama/ollama:0.11.10
    volumes: ["ollama_models:/root/.ollama"]
    restart: unless-stopped
  tests:
    profiles: [test]
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      APP_ENV: ${APP_ENV:-production}
      CONFIRM_DISPOSABLE_TEST_DATABASE: ${CONFIRM_DISPOSABLE_TEST_DATABASE:-false}
      TEST_MIGRATION_DATABASE_URL: postgresql://clinic_migrator:${MIGRATION_DB_PASSWORD:?required}@db:5432/clinic
      TEST_DATABASE_URL: postgresql://clinic_app:${APP_DB_PASSWORD:?required}@db:5432/clinic
      TEST_QUERY_DATABASE_URL: postgresql://clinic_query:${QUERY_DB_PASSWORD:?required}@db:5432/clinic
    depends_on:
      db:
        condition: service_healthy
volumes:
  database:
  ollama_models:
